services:
  postgres:
    image: postgres:15-alpine
    container_name: football-wizard-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: headlessx
    ports:
      - "35432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d headlessx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: football-wizard-redis
    ports:
      - "36379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  headlessx-api:
    build:
      context: ${HEADLESSX_REPO_PATH:-/dev/null}
      dockerfile: infra/docker/api.Dockerfile
    container_name: football-wizard-headlessx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/headlessx?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 8000
      HOST: 0.0.0.0
      NODE_ENV: production
      DASHBOARD_INTERNAL_API_KEY: ${DASHBOARD_INTERNAL_API_KEY}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
    ports:
      - "38473:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    volumes:
      - browser_profile:/app/apps/api/data/browser-profile
    networks:
      - app-network

  football-wizard:
    build: .
    container_name: football-wizard-app
    depends_on:
      headlessx-api:
        condition: service_healthy
    environment:
      HEADLESSX_URL: http://headlessx-api:8000
      HEADLESSX_API_KEY: ${DASHBOARD_INTERNAL_API_KEY}
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    stdin_open: true
    tty: true
    networks:
      - app-network

volumes:
  pgdata:
  browser_profile:

networks:
  app-network:
    driver: bridge
